<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Style | Portal de moda y accesorios</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
 
    <header class="cabecera">
        <div class="barra-sesion">
            <p id="info-sesion">Cargando sesión…</p>
            <p id="info-perfil">Cargando perfil…</p>
        </div>
        <h1 class="marca">Urban Style</h1>
    </header>
 
    <main>
        <section class="oferta" aria-labelledby="titulo-oferta">
            <div class="oferta-contenido">
                <h2 id="titulo-oferta">Oferta Relampago</h2>
                <p class="oferta-texto">Descuento exclusivo durante 15 segundos.</p>
                <p class="oferta-contador"><span id="contador-oferta">15</span><span class="unidad"> s</span></p>
                <p id="mensaje-oferta" class="oferta-mensaje" role="status" aria-live="polite">Pulsa el boton para empezar la cuenta atras.</p>
                <button id="btn-oferta" class="boton boton-oferta" type="button">Activar Oferta Relampago</button>
            </div>
        </section>
 
        <div class="rejilla">
            <section class="panel" aria-labelledby="titulo-catalogo">
                <h2 id="titulo-catalogo">Catalogo</h2>
                <article class="prenda">
                    <h3>Chaqueta Denim</h3>
                    <p class="precio">59.90€</p>
                </article>
                <article class="prenda">
                    <h3>Camiseta Urban</h3>
                    <p class="precio">19.99€</p>
                </article>
            </section>
 
            <section class="panel" aria-labelledby="titulo-carrito">
                <h2 id="titulo-carrito">Tu compra</h2>
                <div id="desglose-carrito" class="desglose"></div>
            </section>
        </div>
 
        <section class="panel panel-ancho" aria-labelledby="titulo-opiniones">
            <h2 id="titulo-opiniones">Opiniones</h2>
 
            <form id="form-resena" class="formulario">
                <label for="texto-resena">Cuéntanos qué te parecen las prendas</label>
                <textarea id="texto-resena" rows="3" placeholder="Escribe tu reseña" required></textarea>
                <button class="boton" type="submit">Publicar reseña</button>
            </form>
 
            <ul id="lista-resenas" class="resenas"></ul>
        </section>
    </main>
</body>
</html>
